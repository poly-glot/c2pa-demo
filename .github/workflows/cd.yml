name: CD

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: cd
    cancel-in-progress: false

env:
    GCP_PROJECT_ID: firebase-cloud-491613
    GCP_REGION: europe-west2
    AR_REPO: firebase-cloud
    CLOUD_RUN_SERVICE: c2pa-demo
    FIREBASE_SITE_ID: c2pa-demo

jobs:
    ci:
        name: CI gate
        uses: ./.github/workflows/ci.yml

    build:
        name: Build and push image
        runs-on: ubuntu-latest
        needs: [ci]
        permissions:
            contents: read
            id-token: write
        outputs:
            image: ${{ steps.meta.outputs.image }}
        steps:
            - uses: actions/checkout@v4

            - uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
                  service_account: ${{ secrets.GCP_SA_EMAIL }}

            - uses: google-github-actions/setup-gcloud@v2

            - run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

            - uses: docker/setup-buildx-action@v3

            - name: Compute image tag
              id: meta
              run: echo "image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.CLOUD_RUN_SERVICE }}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ steps.meta.outputs.image }}
                      ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.CLOUD_RUN_SERVICE }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        name: Deploy Cloud Run and Hosting
        runs-on: ubuntu-latest
        needs: [build]
        permissions:
            contents: read
            id-token: write
        environment:
            name: production
            url: https://${{ env.FIREBASE_SITE_ID }}.web.app
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
                  service_account: ${{ secrets.GCP_SA_EMAIL }}

            - uses: google-github-actions/setup-gcloud@v2

            - name: Deploy to Cloud Run
              run: |
                  gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
                    --image ${{ needs.build.outputs.image }} \
                    --region ${{ env.GCP_REGION }} \
                    --platform managed \
                    --quiet

            - name: Deploy Firebase Hosting
              run: npx firebase-tools@latest deploy --only hosting --project ${{ env.GCP_PROJECT_ID }} --non-interactive

            - name: Smoke test
              run: |
                  for attempt in $(seq 1 12); do
                    HEALTH=$(curl -s -o /dev/null -w '%{http_code}' https://${{ env.FIREBASE_SITE_ID }}.web.app/api/health)
                    GATE=$(curl -s -o /dev/null -w '%{http_code}' https://${{ env.FIREBASE_SITE_ID }}.web.app/)
                    echo "attempt $attempt: health $HEALTH, gate $GATE"
                    if [ "$HEALTH" = "200" ] && [ "$GATE" = "401" ]; then exit 0; fi
                    sleep 15
                  done
                  exit 1
