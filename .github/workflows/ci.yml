name: CI

on:
    pull_request:
    workflow_call:

jobs:
    check:
        name: Lint, format, test, self-check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: cli

            - run: npm ci

            - name: Generate a throwaway signing certificate
              run: npm run certs

            - run: npm run check
