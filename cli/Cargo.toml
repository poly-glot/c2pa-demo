[package]
name = "provenance"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
c2pa = { version = "0.91", default-features = false, features = ["rust_native_crypto"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
