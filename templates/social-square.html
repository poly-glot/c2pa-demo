<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="utf-8" />
        <title>Social square</title>
        <style>
            body {
                background: #ffffff;
                color: #1a1a1a;
                font:
                    28px/1.5 -apple-system,
                    'Helvetica Neue',
                    Helvetica,
                    system-ui,
                    sans-serif;
                height: 1080px;
                margin: 0;
                position: relative;
                width: 1080px;
            }

            [data-slot='photo'] {
                height: 800px;
                object-fit: cover;
                width: 100%;
            }

            [data-slot='logo'] {
                background: #ffffff;
                border: 1px solid #e5e5e5;
                box-sizing: border-box;
                height: 144px;
                object-fit: contain;
                padding: 13px;
                position: absolute;
                right: 34px;
                top: 34px;
                width: 144px;
            }

            h1 {
                font-size: 55px;
                font-weight: 600;
                line-height: 1.2;
                margin: 0;
                padding: 34px 55px;
            }
        </style>
    </head>
    <body data-width="1080" data-height="1080">
        <img data-slot="photo" alt="" />
        <img data-slot="logo" alt="" />
        <h1 data-text="headline">Headline goes here</h1>
    </body>
</html>
