<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="utf-8" />
        <title>Three up</title>
        <style>
            body {
                background: #ffffff;
                box-sizing: border-box;
                color: #1a1a1a;
                display: grid;
                font:
                    28px/1.5 -apple-system,
                    'Helvetica Neue',
                    Helvetica,
                    system-ui,
                    sans-serif;
                gap: 34px;
                grid-template-columns: 1fr 1fr 1fr;
                height: 800px;
                margin: 0;
                padding: 55px 55px 34px;
                width: 1800px;
            }

            figure {
                display: flex;
                flex-direction: column;
                gap: 13px;
                margin: 0;
                min-height: 0;
            }

            img {
                background: #f9f9f9;
                border: 1px solid #e5e5e5;
                flex: 1;
                min-height: 0;
                object-fit: cover;
                width: 100%;
            }

            figcaption {
                color: #616161;
                font-size: 21px;
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }
        </style>
    </head>
    <body data-width="1800" data-height="800">
        <figure>
            <img data-slot="left" alt="" />
            <figcaption>Left</figcaption>
        </figure>
        <figure>
            <img data-slot="centre" alt="" />
            <figcaption>Centre</figcaption>
        </figure>
        <figure>
            <img data-slot="right" alt="" />
            <figcaption>Right</figcaption>
        </figure>
    </body>
</html>
